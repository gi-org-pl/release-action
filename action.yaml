name: Release the action
description: Releases the next version of a GitHub Action and moves its major tag to it
author: gi-org-pl

inputs:
  bump:
    description: Part of the version to increase, patch, minor or major
    required: false
    default: patch
  token:
    description: Token that can create releases in the repository
    required: false
    default: ${{ github.token }}
  working-directory:
    description: Directory of the repository to release
    required: false
    default: .

outputs:
  version:
    description: The released version, empty when the commit was already released
    value: ${{ steps.release.outputs.version }}

runs:
  using: composite
  steps:
    - name: Release the next version and move the major tag
      id: release
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        BUMP: ${{ inputs.bump }}
        GH_TOKEN: ${{ inputs.token }}
      run: ${{ github.action_path }}/release.sh "$BUMP"
